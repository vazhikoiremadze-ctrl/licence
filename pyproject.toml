[project]
name = "sa-exam-scraper"
version = "0.1.0"
description = "Scraper for Georgian driving license exam tickets (api-my.sa.gov.ge)"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
sa-exam-scraper = "sa_exam_scraper.main:main"
sa-exam-backfill = "sa_exam_scraper.backfill:main"
sa-exam-image-backfill = "sa_exam_scraper.image_backfill:main"
sa-exam-seed = "sa_exam_scraper.seeder:main"

[dependency-groups]
dev = []

[tool.hatch.build.targets.wheel]
packages = ["src/sa_exam_scraper"]
